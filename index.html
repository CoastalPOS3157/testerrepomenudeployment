<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="search-bar">
      <input id="menu-search" type="text" placeholder="Search the menu..." />
      <div id="category-pills" class="category-pills"></div>
    </div>
    <div id="menu-root"></div>
  </div>

  <script>
    // Cache-bust so a browser that already visited this page always
    // fetches the latest published menu, instead of possibly reusing an
    // old cached copy of menu-data.js.
    document.write('<script src="menu-data.js?v=' + Date.now() + '"><\/script>');
  </script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu</title>
  <script>
    // style.css and app.js live in ONE shared repo (menu-site-core), not
    // copied into every customer's repo — so a design or behavior fix
    // there reaches every customer's site automatically, with nothing to
    // re-upload per customer. Only this customer's own data (menu-data.js,
    // config.js) lives locally. If the core repo's address ever changes,
    // this line needs updating in every customer's index.html/editor.html.
    var CORE_BASE = "https://coastalpos3157.github.io/menu-site-core/";
    document.write('<link rel="stylesheet" href="' + CORE_BASE + 'style.css?v=' + Date.now() + '" />');
  </script>
</head>
<body>
  <div class="page">
    <div class="search-bar">
      <input id="menu-search" type="text" placeholder="Search the menu..." />
      <div id="category-pills" class="category-pills"></div>
    </div>
    <div id="menu-root"></div>
  </div>

  <script>
    // Cache-bust so a browser that already visited this page always
    // fetches the latest published menu, instead of possibly reusing an
    // old cached copy of menu-data.js.
    document.write('<script src="menu-data.js?v=' + Date.now() + '"><\/script>');
  </script>
  <script>
    document.write('<script src="' + CORE_BASE + 'app.js?v=' + Date.now() + '"><\/script>');
  </script>
</body>
</html>
